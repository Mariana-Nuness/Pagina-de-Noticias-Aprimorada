<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Flex</title>

    <style>
        body{
            margin: 0;
            padding: 0;
            background-color: antiquewhite;
        }
        .container{
            display: flex;
            background-color: rgb(238, 54, 146);
            height: 50px;
            align-items: center;
            justify-content: space-between;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            color: rgb(245, 245, 237);
            padding-left: 90px;
            padding-right: 90px;
        }

        
        

    </style>
</head>
<body>
    <div class="container">
        <img id="menu" style="align-items:center; justify-content:start;" src="burger-bar.png">
        <h2>Blog da Mary</h2>
        <img id="lupa" style="align-items: center; justify-content: end;" src="magnifying-glass.png">
        

    </div>
    
    
</body>
</html>
